# Sized for the hosts that build this today (T-376): the Linux box the gate runs on and the
# maintainer's macOS guest (8 cores, 16 GB), where a Release link of the iOS framework for a
# device — the whole app through Kotlin/Native's LTO — needs this much. A smaller host caps
# them in its own ~/.gradle/gradle.properties, which Gradle reads with higher precedence.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Task outputs are cached and reused across builds and across worktrees (T-226):
# several agents building the same sources in parallel checkouts pull each
# other's compiled classes instead of recompiling them.
org.gradle.caching=true

# No worker cap here (T-226): a host that needs one (the original Raspberry Pi did, with
# `org.gradle.workers.max=2`) sets it in its own ~/.gradle/gradle.properties, not in the repo,
# where every other host would pay for it.
kotlin.daemon.jvmargs=-Xmx6g

# :core's iOS targets compile to klibs on a Linux or Windows host too (T-295), so the gate can
# check that the shared code builds for iOS. Linking an iOS framework still needs a Mac.
kotlin.native.enableKlibsCrossCompilation=true

# The Kotlin/Native compiler's own process, when it runs outside the daemon: the same need as
# the daemons' above (the device link, T-353).
kotlin.native.jvmArgs=-Xmx6g
