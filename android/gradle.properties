org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Task outputs are cached and reused across builds and across worktrees (T-226):
# several agents building the same sources in parallel checkouts pull each
# other's compiled classes instead of recompiling them.
org.gradle.caching=true

# No worker cap here (T-226). The original build host, a Raspberry Pi with 4 cores
# and 3.7 GB, needed `org.gradle.workers.max=2` and a 1 GB Kotlin daemon so the
# Gradle daemon, the Kotlin daemon, KSP and a qemu-emulated AAPT2 did not peak
# together and swap. Those limits belong in THAT machine's
# ~/.gradle/gradle.properties, which Gradle reads with higher precedence than this
# file — not in the repo, where every other host paid for them (an 8-core box was
# building with two workers).
kotlin.daemon.jvmargs=-Xmx1024m

# :core's iOS targets compile to klibs on a Linux or Windows host too (T-295), so the gate can
# check that the shared code builds for iOS. Linking an iOS framework still needs a Mac.
kotlin.native.enableKlibsCrossCompilation=true

# A Release link of the iOS framework for a device (arm64, the whole app optimized by
# Kotlin/Native's LTO) needs far more heap than the daemons above have: a Mac that links it
# raises them in its own ~/.gradle/gradle.properties (org.gradle.jvmargs=-Xmx8g,
# kotlin.daemon.jvmargs=-Xmx6g, kotlin.native.jvmArgs=-Xmx6g; see ../ios/README.md, T-353). The
# value here is for the compiler's own process when it runs outside the daemon.
kotlin.native.jvmArgs=-Xmx4g
