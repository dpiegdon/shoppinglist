org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# This box is 4 cores / 3.7GB RAM: the Gradle daemon, the separate Kotlin compile daemon, KSP,
# and qemu-emulated AAPT2 (no native aarch64 build, see app/build.gradle.kts) can otherwise all
# peak concurrently and push the machine into swap. Cap worker/compile parallelism instead of
# letting Gradle default to nproc everywhere.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m
