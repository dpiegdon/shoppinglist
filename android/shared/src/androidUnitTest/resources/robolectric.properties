# Robolectric's native runtime has no Linux/aarch64 binaries (upstream gap, see
# https://github.com/robolectric/robolectric/issues/9166) — both SQLiteMode.NATIVE and
# GraphicsMode.NATIVE depend on it and crash with "native runtime is not supported on
# Linux (aarch64)" on ARM64 dev/CI hosts. Force the legacy (pure-JVM) shadows everywhere, except
# the screenshot tests (ui/screenshots), which ask for GraphicsMode.NATIVE per class and are left
# out on Linux/aarch64 by ../build.gradle.kts.
sqliteMode=LEGACY
graphicsMode=LEGACY

# Run under a bare Application, so no test starts what an app would (see RobolectricTestApp).
application=org.p23q.shoppinglist.RobolectricTestApp
