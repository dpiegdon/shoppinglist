# Robolectric's native runtime has no Linux/aarch64 binaries (upstream gap, see
# https://github.com/robolectric/robolectric/issues/9166) — both SQLiteMode.NATIVE and
# GraphicsMode.NATIVE depend on it and crash with "native runtime is not supported on
# Linux (aarch64)" on ARM64 dev/CI hosts. Force the legacy (pure-JVM) shadows everywhere.
sqliteMode=LEGACY
graphicsMode=LEGACY
