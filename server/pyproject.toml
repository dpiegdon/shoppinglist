[project]
name = "shoppinglist-server"
version = "3.4.0"
description = "Flask blueprint + SQLite backend for Tuppu, a shared, offline-first list app."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["../LICENSE"]
authors = [{ name = "David R. Piegdon", email = "dgit@piegdon.de" }]
keywords = ["shopping-list", "flask", "blueprint", "sqlite", "offline-first", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "flask>=3.1",  # request.max_content_length is settable per request from 3.1 (T-250)
]

[project.urls]
Homepage = "https://github.com/dpiegdon/shoppinglist"
Source = "https://github.com/dpiegdon/shoppinglist"
Issues = "https://github.com/dpiegdon/shoppinglist/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "cryptography>=42.0",  # only for the ad-hoc TLS dev server (dev_tls_server.py)
    # The build backend, pinned exactly (T-281): build-wheel.sh runs `pip wheel
    # --no-build-isolation` so it uses this installed copy instead of fetching one
    # from PyPI late, mid-release. Keep this version in step with [build-system]
    # below when it moves.
    "setuptools==84.0.0",
    # Lint/format stack (T-141), run by ../verify-all.sh. Pinned exactly: the lint
    # stage is the gate's first check, and an unpinned formatter release can fail
    # every checkout the moment it publishes a new opinion about layout.
    "black==26.5.1",
    "isort==9.0.1",
    "ruff==0.16.8",
    "ty==0.0.83",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shoppinglist_server = ["schema.sql", "templates/shoppinglist_server/*.html", "web_dist/**", "apk/*.apk"]

# ---------------------------------------------------------------------------
# Lint / format configuration (T-141)
#
# black is the authority on layout. isort runs in black's profile so the two can
# never disagree about imports, and ruff is a LINTER here only — its formatter is
# not used and its import-sorting rules are off, so nothing competes for the same
# job. Line length is set in all three because each reads its own setting.
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
# Pinned rather than inferred: black otherwise guesses a target from the syntax it
# sees and can pick a version newer than the interpreter running it, which makes it
# skip its own AST equivalence check with a warning.
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F",    # pyflakes — real errors: undefined names, unused imports, shadowing
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "B",    # bugbear — mutable defaults, except-without-raise-from, loop-variable capture
    "C4",   # comprehension rewrites
    "UP",   # pyupgrade — this package is >=3.11, so old idioms are just noise
]
ignore = [
    # Layout belongs to black. These are the rules that argue with a formatter:
    # line length, and every indentation/whitespace opinion.
    "E501",
    "E111", "E114", "E117",
    "W191",
    # Ruff's isort rules would duplicate (and could contradict) isort itself.
    "I001",
]
