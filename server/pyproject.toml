[project]
name = "shoppinglist-server"
version = "1.9.0"
description = "Flask blueprint + SQLite backend for a shared, offline-first shopping-list app."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["../LICENSE"]
authors = [{ name = "David R. Piegdon", email = "dgit@piegdon.de" }]
keywords = ["shopping-list", "flask", "blueprint", "sqlite", "offline-first", "self-hosted"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "flask>=3.0",
]

[project.urls]
Homepage = "https://github.com/dpiegdon/shoppinglist"
Source = "https://github.com/dpiegdon/shoppinglist"
Issues = "https://github.com/dpiegdon/shoppinglist/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "cryptography>=42.0",  # only for the ad-hoc TLS dev server (dev_tls_server.py)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shoppinglist_server = ["schema.sql", "templates/*.html", "web_dist/*", "web_dist/assets/*", "apk/*.apk"]
